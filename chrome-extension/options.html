<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SleepUp WhatsApp Call settings</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; color: #1B2F4B; max-width: 460px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin-bottom: 6px; color: #56677D; }
  input { width: 100%; padding: 10px; border: 2px solid #D9E0EA; border-radius: 8px; font: inherit; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #1B2F4B; color: #fff; font: inherit; cursor: pointer; }
  #saved { margin-left: 10px; color: #138A55; }
</style></head>
<body>
  <h1 style="font-size:20px">Dialer address</h1>
  <label for="url">Your dialer link</label>
  <input id="url" placeholder="https://dialer.sleepupmattress.com">
  <button id="save" type="button">Save</button><span id="saved" hidden>Saved</span>
  <script src="options.js"></script>
</body>
</html>
